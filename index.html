<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Workplace - ai</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0b0b;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Zoomミーティングアプリ枠 */
    .zoom-app {
      width: 100%;
      max-width: 680px;
      height: 100vh;
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
    }

    /* ==========================================
       Zoom 上部ツールバー（本物のZoomヘッダー）
       ========================================== */
    .zoom-top-bar {
      width: 100%;
      height: 48px;
      background: #1e1e1e;
      border-bottom: 1px solid #2d2d2d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 30;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .zoom-shield-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #22c55e;
      cursor: pointer;
    }

    .meeting-title {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .top-center {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #94a3b8;
    }

    .rec-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }

    .rec-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .meeting-timer {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: #cbd5e1;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .view-btn {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .view-btn:hover {
      background: #333333;
    }

    /* ==========================================
       メインビデオ表示エリア（Zoomビデオグリッド）
       ========================================== */
    .video-viewport {
      flex: 1;
      width: 100%;
      background: #000000;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* 相手（ai）のZoomビデオカード */
    .video-card {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 140px);
      background: #141414;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid transparent;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: border-color 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }

    /* お話し中：Zoom本物と同じ鮮やかなグリーンの発言者枠！ */
    .video-card.speaking {
      border-color: #00da5a;
      box-shadow: 0 0 24px rgba(0, 218, 90, 0.45);
    }

    /* アバター動画 */
    .remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    /* Zoom 左下ネームタグ（ai） */
    .name-tag {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .mic-status-icon {
      font-size: 12px;
      color: #22c55e;
    }

    /* Zoom 右上セルフビュー小窓（インカメラ風） */
    .self-view {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 110px;
      height: 140px;
      background: #222222;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      overflow: hidden;
    }

    .self-avatar-icon {
      font-size: 34px;
      color: #64748b;
      margin-bottom: 6px;
    }

    .self-name-tag {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.7);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* Zoom 自動字幕（Live Transcript / 字幕） */
    .zoom-live-transcript {
      position: absolute;
      bottom: 55px;
      left: 20px;
      right: 20px;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      line-height: 1.45;
      color: #f8fafc;
      text-align: center;
      z-index: 12;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      transition: opacity 0.2s;
    }

    .transcript-speaker {
      font-size: 11px;
      font-weight: bold;
      color: #0ea5e9;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* ==========================================
       Zoom 下部コントロールツールバー（本物のZoom）
       ========================================== */
    .zoom-toolbar {
      width: 100%;
      height: 72px;
      background: #181818;
      border-top: 1px solid #282828;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 30;
    }

    .toolbar-left, .toolbar-center, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Zoom ボタン共通スタイル */
    .zoom-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 10px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      min-width: 52px;
      transition: all 0.15s;
    }

    .zoom-btn:hover {
      background: #2a2a2a;
      color: #ffffff;
    }

    .zoom-btn-icon {
      font-size: 20px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* メインマイク（ミュート / ミュート解除） */
    .zoom-btn.mic-unmuted {
      color: #22c55e;
    }

    .zoom-btn.mic-recording {
      color: #22c55e;
      background: rgba(34, 197, 94, 0.15);
      animation: micGlow 1s infinite alternate;
    }

    @keyframes micGlow {
      0% { box-shadow: 0 0 5px rgba(34, 197, 94, 0.4); }
      100% { box-shadow: 0 0 15px rgba(34, 197, 94, 0.9); }
    }

    /* Zoom 終了ボタン（赤い「End」ボタン） */
    .zoom-leave-btn {
      background: #e11d48;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }

    .zoom-leave-btn:hover {
      background: #be123c;
    }

    /* カギ設定モーダル */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-card {
      background: #262626;
      padding: 22px;
      border-radius: 10px;
      width: 100%;
      max-width: 360px;
      border: 1px solid #3f3f46;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    .modal-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .modal-desc {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .modal-input {
      width: 100%;
      padding: 10px;
      background: #171717;
      border: 1px solid #3f3f46;
      color: white;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-btn {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      border: none;
    }

    .modal-btn.cancel { background: #3f3f46; color: white; }
    .modal-btn.save { background: #0e71eb; color: white; font-weight: bold; } /* Zoomブルー */
  </style>
</head>
<body>

  <div class="zoom-app">
    <!-- ==========================================
         Zoom 上部ツールバー（本物のZoom）
         ========================================== -->
    <div class="zoom-top-bar">
      <div class="top-left">
        <div class="zoom-shield-badge" title="暗号化接続中">
          <span>🛡️</span>
          <span>Zoom</span>
        </div>
        <div class="meeting-title">Zoom Meeting</div>
      </div>

      <div class="top-center">
        <div class="rec-badge">
          <span class="rec-dot"></span>
          <span>REC</span>
        </div>
        <div class="meeting-timer" id="meetingTimer">00:00</div>
      </div>

      <div class="top-right">
        <button class="view-btn">⊞ 表示</button>
      </div>
    </div>

    <!-- ==========================================
         メインビデオ画面（Zoomの相手カメラ画面）
         ========================================== -->
    <div class="video-viewport">
      <div class="video-card" id="videoCard" title="タップでテスト発言します">
        <video id="avatarVideo" class="remote-video" src="avatar.mp4?v=20261109" poster="avatar.jpg?v=20261109" playsinline muted loop preload="auto"></video>
        
        <!-- 左下のネームプレート（ai） -->
        <div class="name-tag">
          <span class="mic-status-icon" id="aiMicIcon">🎙️</span>
          <span>ai</span>
        </div>

        <!-- 右上のセルフビュー（あなた） -->
        <div class="self-view">
          <div class="self-avatar-icon">👤</div>
          <div class="self-name-tag">
            <span>🔇</span>
            <span>あなた</span>
          </div>
        </div>

        <!-- Zoom リアルタイム字幕（Live Captions） -->
        <div class="zoom-live-transcript" id="liveTranscript">
          <div class="transcript-speaker" id="transcriptSpeaker">
            <span>💬</span>
            <span id="speakerName">ai</span>
          </div>
          <div id="transcriptText">こんにちは！下のマイクボタンを押してお話ししてくださいね。</div>
        </div>
      </div>
    </div>

    <!-- ==========================================
         Zoom 下部コントロールツールバー
         ========================================== -->
    <div class="zoom-toolbar">
      <div class="toolbar-left">
        <!-- マイクボタン（ミュート解除して話しかける） -->
        <button class="zoom-btn" id="micBtn" title="押して話しかける">
          <div class="zoom-btn-icon" id="micBtnIcon">🎙️</div>
          <span id="micBtnLabel">ミュート解除</span>
        </button>

        <!-- ビデオボタン -->
        <button class="zoom-btn" title="ビデオの開始/停止">
          <div class="zoom-btn-icon">📹</div>
          <span>ビデオの停止</span>
        </button>
      </div>

      <div class="toolbar-center">
        <!-- 口の速度変更 -->
        <button class="zoom-btn" id="speedBtn" title="口の速度を変更">
          <div class="zoom-btn-icon">⚡</div>
          <span id="speedBtnLabel">速度 0.85x</span>
        </button>

        <!-- 字幕ボタン -->
        <button class="zoom-btn" id="transcriptToggleBtn" title="字幕の表示/非表示">
          <div class="zoom-btn-icon">💬</div>
          <span>字幕</span>
        </button>

        <!-- 設定ボタン -->
        <button class="zoom-btn" id="keyBtn" title="AIのカギ設定">
          <div class="zoom-btn-icon">⚙️</div>
          <span>設定</span>
        </button>
      </div>

      <div class="toolbar-right">
        <!-- Zoom 終了ボタン -->
        <button class="zoom-leave-btn" id="leaveBtn">終了</button>
      </div>
    </div>

    <!-- カギ設定モーダル -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card">
        <div class="modal-title">⚙️ Google AIカギ設定</div>
        <div class="modal-desc">Google AI Studioのカギを貼り付けると、aiが何でも声で考えてお返事します。</div>
        <input type="password" id="apiKeyInput" class="modal-input" placeholder="AIzaSy...">
        <div class="modal-btns">
          <button class="modal-btn cancel" id="modalCancel">キャンセル</button>
          <button class="modal-btn save" id="modalSave">保存する</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const EMBEDDED_API_KEY = ""; 

    const videoCard = document.getElementById('videoCard');
    const avatarVideo = document.getElementById('avatarVideo');
    const aiMicIcon = document.getElementById('aiMicIcon');
    const liveTranscript = document.getElementById('liveTranscript');
    const speakerName = document.getElementById('speakerName');
    const transcriptText = document.getElementById('transcriptText');
    const micBtn = document.getElementById('micBtn');
    const micBtnIcon = document.getElementById('micBtnIcon');
    const micBtnLabel = document.getElementById('micBtnLabel');
    const speedBtn = document.getElementById('speedBtn');
    const speedBtnLabel = document.getElementById('speedBtnLabel');
    const transcriptToggleBtn = document.getElementById('transcriptToggleBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const meetingTimer = document.getElementById('meetingTimer');

    const keyBtn = document.getElementById('keyBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modalCancel = document.getElementById('modalCancel');
    const modalSave = document.getElementById('modalSave');

    const API_KEY_STORAGE = 'voice_ai_gemini_key';

    // ミーティング経過時間タイマー
    let secondsElapsed = 0;
    setInterval(() => {
      secondsElapsed++;
      const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const s = String(secondsElapsed % 60).padStart(2, '0');
      meetingTimer.textContent = `${m}:${s}`;
    }, 1000);

    // 口の速度切り替え（0.85x → 1.0x → 0.7x）
    const speeds = [0.85, 1.0, 0.7];
    let speedIndex = 0;
    let currentSpeed = speeds[speedIndex];

    speedBtn.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % speeds.length;
      currentSpeed = speeds[speedIndex];
      speedBtnLabel.textContent = `速度 ${currentSpeed}x`;
      if (avatarVideo) {
        avatarVideo.playbackRate = currentSpeed;
      }
      speakText(`速度を${currentSpeed}倍に変更しました。`);
    });

    // 字幕の表示/非表示
    transcriptToggleBtn.addEventListener('click', () => {
      liveTranscript.style.display = (liveTranscript.style.display === 'none') ? 'block' : 'none';
    });

    // 終了ボタン
    leaveBtn.addEventListener('click', () => {
      if (confirm('Zoomミーティングを退出しますか？')) {
        speakText('ミーティングを終了します。お疲れ様でした！');
      }
    });

    // カギ取得
    function getApiKey() {
      if (EMBEDDED_API_KEY && EMBEDDED_API_KEY.trim() !== "") {
        return EMBEDDED_API_KEY.trim();
      }
      return localStorage.getItem(API_KEY_STORAGE) || "";
    }

    // カギ設定モーダル
    keyBtn.addEventListener('click', () => {
      apiKeyInput.value = getApiKey();
      modalOverlay.style.display = 'flex';
    });

    modalCancel.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
    });

    modalSave.addEventListener('click', () => {
      const val = apiKeyInput.value.trim();
      if (val) {
        localStorage.setItem(API_KEY_STORAGE, val);
        modalOverlay.style.display = 'none';
        speakText('新しいカギを保存しました！何でも声でお話ししてくださいね。');
      } else {
        localStorage.removeItem(API_KEY_STORAGE);
        modalOverlay.style.display = 'none';
      }
    });

    // ==========================================
    // 1. AIが声でお返事する機能（Zoom本物と同じ緑色発言枠！）
    // ==========================================
    function speakText(text) {
      if (!window.speechSynthesis) {
        transcriptText.textContent = text;
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 1.0;
      utterance.pitch = 1.1;

      const voices = window.speechSynthesis.getVoices();
      const jaVoice = voices.find(v => v.lang.includes('ja') && (v.name.includes('Google') || v.name.includes('Kyoko') || v.name.includes('Ayumi') || v.name.includes('Natural') || v.name.includes('Haruka')));
      if (jaVoice) {
        utterance.voice = jaVoice;
      }

      // 音声開始：Zoom本物と同じ鮮やかなグリーンの発言者枠が光る！
      utterance.onstart = () => {
        videoCard.classList.add('speaking');
        aiMicIcon.textContent = '🎙️';
        aiMicIcon.style.color = '#22c55e';
        speakerName.textContent = 'ai (発言中)';
        transcriptText.textContent = text;
        if (avatarVideo) {
          avatarVideo.playbackRate = currentSpeed;
          avatarVideo.play().catch(e => console.log('Video play error:', e));
        }
      };

      // 音声終了：枠の光を消して動画を停止！
      utterance.onend = () => {
        videoCard.classList.remove('speaking');
        speakerName.textContent = 'ai';
        if (avatarVideo) {
          avatarVideo.pause();
          avatarVideo.currentTime = 0;
        }
      };

      utterance.onerror = () => {
        videoCard.classList.remove('speaking');
        speakerName.textContent = 'ai';
        if (avatarVideo) {
          avatarVideo.pause();
          avatarVideo.currentTime = 0;
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    // 相手の画面をタップするとテスト発言！
    videoCard.addEventListener('click', () => {
      speakText('こんにちは！Zoomミーティングへようこそ。下のマイクを押してお話ししてくださいね！');
    });

    // ==========================================
    // 2. 音声認識（あなたの声を聴き取る耳！）
    // ==========================================
    let recognition = null;
    let isRecording = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('mic-recording');
        micBtnIcon.textContent = '🔴';
        micBtnLabel.textContent = 'ミュート中';
        speakerName.textContent = 'あなた';
        transcriptText.textContent = 'お話し中…（話し終わると自動でお返事します）';
      };

      recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript;
        speakerName.textContent = 'あなた';
        transcriptText.textContent = spokenText;
        handleUserQuery(spokenText);
      };

      recognition.onerror = (event) => {
        console.error(event);
        resetMic();
        if (event.error === 'not-allowed') {
          alert('マイクの利用が許可されていません。ブラウザのアドレスバーからマイクを許可してください！');
        }
      };

      recognition.onend = () => {
        resetMic();
      };
    } else {
      micBtnLabel.textContent = '非対応';
    }

    function resetMic() {
      isRecording = false;
      micBtn.classList.remove('mic-recording');
      micBtnIcon.textContent = '🎙️';
      micBtnLabel.textContent = 'ミュート解除';
    }

    // マイクボタンクリック
    micBtn.addEventListener('click', () => {
      if (!recognition) {
        alert('このブラウザはマイクに対応していません。ChromeまたはSafariでお試しください！');
        return;
      }

      if (isRecording) {
        recognition.stop();
      } else {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        videoCard.classList.remove('speaking');
        if (avatarVideo) {
          avatarVideo.pause();
          avatarVideo.currentTime = 0;
        }

        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    });

    // ==========================================
    // 3. AIの頭脳（Google Gemini ＋ 内蔵スマート頭脳）
    // ==========================================
    async function handleUserQuery(query) {
      speakerName.textContent = 'ai';
      transcriptText.textContent = 'aiが考え中…💭';

      const apiKey = getApiKey();
      const q = query.toUpperCase();
      let reply = '';

      // 内蔵知識（カギがなくても即座に声でおしゃべり！）
      if (q.includes('こんにちは') || q.includes('初めまして') || q.includes('ハロー')) {
        reply = 'こんにちは！Zoomミーティングにご参加いただきありがとうございます。今日はどんなお話をしましょうか？';
      } else if (q.includes('自己紹介') || q.includes('誰') || q.includes('名前')) {
        reply = '私はあなたの専属aiアシスタントです！Zoomでいつでもこうしてお話しできますよ。何でも聞いてくださいね！';
      } else if (q.includes('元気') || q.includes('調子')) {
        reply = '絶好調ですよ！Zoomでお会いできて嬉しいです。あなたは今日どんな一日でしたか？';
      } else if (q.includes('ミネストローネ') || q.includes('レシピ') || q.includes('料理')) {
        reply = 'ミネストローネですね！玉ねぎ、人参、ベーコンを炒めて、トマト缶とコンソメで煮込むだけで美味しく作れますよ！';
      } else if (q.includes('GDP') || q.includes('経済') || q.includes('成長率')) {
        reply = '世界のGDPトップはアメリカ、2位が中国、3位ドイツ、4位日本です！インドの急成長もすごい勢いですね。';
      } else if (q.includes('日本') && (q.includes('予測') || q.includes('今後') || q.includes('将来'))) {
        reply = '今後の日本は、賃上げとデフレ脱却、そしてAIへの投資が最大の鍵になると予測されています！';
      } else if (q.includes('天気')) {
        reply = '今日はお散歩日和だといいですね！お出かけのときは上着を一枚持っていくと安心ですよ。';
      } else if (q.includes('ありがとう')) {
        reply = 'どういたしまして！お役に立ててとっても嬉しいです！';
      }

      // カギがあればGoogle Gemini AIに口頭用ショート回答を作ってもらう
      if (!reply && apiKey) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `あなたはZoomでオンライン対話をしている親切で聡明な女性AIパートナー「ai」です。親しみやすく落ち着いた自然な日本語で、音声会話用として聞き取りやすいように、1〜2文（最大80文字程度）で簡潔にお返事してください。\n\n質問: ${query}`
                }]
              }]
            })
          });

          if (!response.ok) {
            throw new Error(`APIエラー: ${response.status}`);
          }

          const data = await response.json();
          reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        } catch (e) {
          console.error(e);
          reply = '電波の調子が乱れたようです。もう一度お話しいただけますか？';
        }
      }

      if (!reply) {
        reply = `「${query}」ですね！よく分かりました。あなたとZoomでお話しできてとても楽しいです！`;
      }

      speakText(reply);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zoom - ai</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    /* 普通のZoomアプリ枠（画面全体に固定） */
    .zoom-app {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background-color: #1a1a1a;
      overflow: hidden;
    }

    /* ==========================================
       1. 上部：Zoomヘッダー（最上部に絶対固定！）
       ========================================== */
    .zoom-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: #1f1f1f;
      border-bottom: 1px solid #2d2d2d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
    }

    .top-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #22c55e;
      font-size: 14px;
      font-weight: bold;
    }

    .brand-name {
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .meeting-timer {
      font-size: 12px;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
    }

    .leave-btn {
      background: #e11d48;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ==========================================
       2. 下部：Zoomツールバー（最下部に絶対固定！100%消えない！）
       ========================================== */
    .zoom-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #1f1f1f;
      border-top: 1px solid #333333;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 4px 6px 12px;
      z-index: 100;
    }

    /* 各アイコン項目 */
    .zoom-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 10px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      min-width: 52px;
      transition: background 0.15s, color 0.15s;
    }

    .zoom-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .zoom-icon {
      font-size: 22px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* メインマイク（一目でマイクとわかるデザイン！） */
    .zoom-item.mic-btn-main {
      color: #22c55e;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.4);
      padding: 5px 10px;
      border-radius: 8px;
    }

    .zoom-item.mic-recording {
      color: #ef4444 !important;
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: #ef4444 !important;
      animation: pulseMic 1s infinite alternate;
    }

    @keyframes pulseMic {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* ==========================================
       3. 中央：ビデオエリア（無駄な空間ゼロ！画面いっぱいにフィット！）
       ========================================== */
    .zoom-video-area {
      position: absolute;
      top: 44px;
      bottom: 70px;
      left: 0;
      right: 0;
      padding: 0; /* 無駄な余白ゼロ！ */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000000;
    }

    /* 相手（ai）のカメラ画面（隙間なく全画面フィット！） */
    .video-card {
      width: 100%;
      height: 100%;
      background: #111111;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.15s;
    }

    /* 発言中：Zoom特有の内側グリーン枠！ */
    .video-card.speaking {
      box-shadow: inset 0 0 0 4px #00da5a;
    }

    .remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    /* Zoom 左下ネームタグ（ai） */
    .name-tag {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #ffffff;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .mic-dot {
      color: #22c55e;
      font-size: 12px;
    }

    /* Zoom 右上セルフビュー（あなた） */
    .self-view {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 75px;
      height: 100px;
      background: #262626;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: #94a3b8;
      font-size: 10px;
    }

    .self-icon {
      font-size: 24px;
      margin-bottom: 2px;
    }

    /* Zoom 字幕（ビデオの上にスタイリッシュに浮かび上がるLive Captions！） */
    .zoom-captions {
      position: absolute;
      bottom: 50px;
      left: 16px;
      right: 16px;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      line-height: 1.4;
      color: #f8fafc;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
      z-index: 15;
    }

    .caption-speaker {
      font-size: 10px;
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 2px;
    }

    /* カギ設定モーダル */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }

    .modal-card {
      background: #27272a;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 320px;
      border: 1px solid #3f3f46;
    }

    .modal-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #f8fafc;
    }

    .modal-desc {
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .modal-input {
      width: 100%;
      padding: 10px;
      background: #18181b;
      border: 1px solid #3f3f46;
      color: white;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      border: none;
    }

    .modal-btn.cancel { background: #3f3f46; color: white; }
    .modal-btn.save { background: #0e71eb; color: white; font-weight: bold; }
  </style>
</head>
<body>

  <div class="zoom-app">
    <!-- 1. 上部：普通のZoomヘッダー（最上部に固定！） -->
    <div class="zoom-top-bar">
      <div class="top-brand">
        <span>🛡️</span>
        <span class="brand-name">Zoom</span>
      </div>
      <div class="meeting-timer" id="meetingTimer">00:00</div>
      <button class="leave-btn" id="leaveBtn">終了</button>
    </div>

    <!-- 2. 中央：相手（ai）のカメラ画面（隙間なく全画面フィット！） -->
    <div class="zoom-video-area">
      <div class="video-card" id="videoCard" title="タップでテスト発言します">
        <video id="avatarVideo" class="remote-video" src="avatar.mp4?v=20261109" poster="avatar.jpg?v=20261109" playsinline muted loop preload="auto"></video>
        
        <!-- 左下のネームタグ（ai） -->
        <div class="name-tag">
          <span class="mic-dot">🎙️</span>
          <span>ai</span>
        </div>

        <!-- 右上のセルフビュー（あなた） -->
        <div class="self-view">
          <div class="self-icon">👤</div>
          <div>あなた</div>
        </div>

        <!-- 字幕（ビデオの上にスタイリッシュに浮かび上がる！） -->
        <div class="zoom-captions" id="zoomCaptions">
          <div class="caption-speaker" id="captionSpeaker">ai</div>
          <div id="captionText">こんにちは！下のマイクを押してお話ししてくださいね。</div>
        </div>
      </div>
    </div>

    <!-- 3. 下部：普通のZoomツールバー（最下部に絶対固定！100%消えません！） -->
    <div class="zoom-bottom-bar">
      <!-- 🎙️ マイク（ここを押して話しかける！） -->
      <button class="zoom-item mic-btn-main" id="micBtn" title="押して話しかける">
        <div class="zoom-icon" id="micIcon">🎙️</div>
        <span id="micLabel" style="font-weight: bold;">マイク</span>
      </button>

      <!-- 📹 ビデオ -->
      <button class="zoom-item" title="ビデオの開始/停止">
        <div class="zoom-icon">📹</div>
        <span>ビデオ</span>
      </button>

      <!-- ⚡ 速度 -->
      <button class="zoom-item" id="speedBtn" title="口の速度を変更">
        <div class="zoom-icon">⚡</div>
        <span id="speedLabel">速度 0.85x</span>
      </button>

      <!-- 💬 字幕 -->
      <button class="zoom-item" id="captionToggleBtn" title="字幕の表示/非表示">
        <div class="zoom-icon">💬</div>
        <span>字幕</span>
      </button>

      <!-- ⚙️ 設定 -->
      <button class="zoom-item" id="keyBtn" title="AIのカギ設定">
        <div class="zoom-icon">⚙️</div>
        <span>設定</span>
      </button>
    </div>

    <!-- カギ設定モーダル -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card">
        <div class="modal-title">⚙️ Google AIカギ設定</div>
        <div class="modal-desc">Google AI Studioのカギを貼り付けると、aiが何でも声で考えてお返事します。</div>
        <input type="password" id="apiKeyInput" class="modal-input" placeholder="AIzaSy...">
        <div class="modal-btns">
          <button class="modal-btn cancel" id="modalCancel">キャンセル</button>
          <button class="modal-btn save" id="modalSave">保存する</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const EMBEDDED_API_KEY = ""; 

    const videoCard = document.getElementById('videoCard');
    const avatarVideo = document.getElementById('avatarVideo');
    const zoomCaptions = document.getElementById('zoomCaptions');
    const captionSpeaker = document.getElementById('captionSpeaker');
    const captionText = document.getElementById('captionText');
    const micBtn = document.getElementById('micBtn');
    const micIcon = document.getElementById('micIcon');
    const micLabel = document.getElementById('micLabel');
    const speedBtn = document.getElementById('speedBtn');
    const speedLabel = document.getElementById('speedLabel');
    const captionToggleBtn = document.getElementById('captionToggleBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const meetingTimer = document.getElementById('meetingTimer');

    const keyBtn = document.getElementById('keyBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modalCancel = document.getElementById('modalCancel');
    const modalSave = document.getElementById('modalSave');

    const API_KEY_STORAGE = 'voice_ai_gemini_key';

    // ミーティング経過時間タイマー
    let secondsElapsed = 0;
    setInterval(() => {
      secondsElapsed++;
      const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const s = String(secondsElapsed % 60).padStart(2, '0');
      meetingTimer.textContent = `${m}:${s}`;
    }, 1000);

    // 口の速度切り替え（0.85x → 1.0x → 0.7x）
    const speeds = [0.85, 1.0, 0.7];
    let speedIndex = 0;
    let currentSpeed = speeds[speedIndex];

    speedBtn.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % speeds.length;
      currentSpeed = speeds[speedIndex];
      speedLabel.textContent = `速度 ${currentSpeed}x`;
      if (avatarVideo) {
        avatarVideo.playbackRate = currentSpeed;
      }
      speakText(`速度を${currentSpeed}倍に変更しました。`);
    });

    // 字幕の表示/非表示
    captionToggleBtn.addEventListener('click', () => {
      zoomCaptions.style.display = (zoomCaptions.style.display === 'none') ? 'flex' : 'none';
    });

    // 終了ボタン
    leaveBtn.addEventListener('click', () => {
      if (confirm('Zoomを終了しますか？')) {
        speakText('通話を終了します。お疲れ様でした！');
      }
    });

    // カギ取得
    function getApiKey() {
      if (EMBEDDED_API_KEY && EMBEDDED_API_KEY.trim() !== "") {
        return EMBEDDED_API_KEY.trim();
      }
      return localStorage.getItem(API_KEY_STORAGE) || "";
    }

    // カギ設定モーダル
    keyBtn.addEventListener('click', () => {
      apiKeyInput.value = getApiKey();
      modalOverlay.style.display = 'flex';
    });

    modalCancel.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
    });

    modalSave.addEventListener('click', () => {
      const val = apiKeyInput.value.trim();
      if (val) {
        localStorage.setItem(API_KEY_STORAGE, val);
        modalOverlay.style.display = 'none';
        speakText('新しいカギを保存しました！何でも声でお話ししてくださいね。');
      } else {
        localStorage.removeItem(API_KEY_STORAGE);
        modalOverlay.style.display = 'none';
      }
    });

    // ==========================================
    // 1. AIが声でお返事する機能（Zoom緑枠連動！）
    // ==========================================
    function speakText(text) {
      if (!window.speechSynthesis) {
        captionText.textContent = text;
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 1.0;
      utterance.pitch = 1.1;

      const voices = window.speechSynthesis.getVoices();
      const jaVoice = voices.find(v => v.lang.includes('ja') && (v.name.includes('Google') || v.name.includes('Kyoko') || v.name.includes('Ayumi') || v.name.includes('Natural') || v.name.includes('Haruka')));
      if (jaVoice) {
        utterance.voice = jaVoice;
      }

      // 音声開始：Zoom本物と同じ緑の発言枠が光る！
      utterance.onstart = () => {
        videoCard.classList.add('speaking');
        captionSpeaker.textContent = 'ai (発言中)';
        captionText.textContent = text;
        if (avatarVideo) {
          avatarVideo.playbackRate = currentSpeed;
          avatarVideo.play().catch(e => console.log('Video play error:', e));
        }
      };

      // 音声終了：枠の光を消して動画を停止！
      utterance.onend = () => {
        videoCard.classList.remove('speaking');
        captionSpeaker.textContent = 'ai';
        if (avatarVideo) {
          avatarVideo.pause();
          avatarVideo.currentTime = 0;
        }
      };

      utterance.onerror = () => {
        videoCard.classList.remove('speaking');
        captionSpeaker.textContent = 'ai';
        if (avatarVideo) {
          avatarVideo.pause();
          avatarVideo.currentTime = 0;
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    // 画面タップでテスト発言！
    videoCard.addEventListener('click', () => {
      speakText('こんにちは！Zoomへようこそ。下のマイクを押してお話ししてね！');
    });

    // ==========================================
    // 2. 音声認識（あなたの声を聴き取る耳！）
    // ==========================================
    let recognition = null;
    let isRecording = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('mic-recording');
        micIcon.textContent = '🔴';
        micLabel.textContent = '話中…';
        captionSpeaker.textContent = 'あなた';
        captionText.textContent = 'お話し中…（話し終わると自動でお返事します）';
      };

      recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript;
        captionSpeaker.textContent = 'あなた';
        captionText.textContent = spokenText;
        handleUserQuery(spokenText);
      };

      recognition.onerror = (event) => {
        console.error(event);
        resetMic();
        if (event.error === 'not-allowed') {
          alert('マイクの利用が許可されていません。ブラウザのアドレスバーからマイクを許可してください！');
        }
      };

      recognition.onend = () => {
        resetMic();
      };
    } else {
      micLabel.textContent = '非対応';
    }

    function resetMic() {
      isRecording = false;
      micBtn.classList.remove('mic-recording');
      micIcon.textContent = '🎙️';
      micLabel.textContent = 'マイク';
    }

    // 下の項目の「🎙️ マイク」ボタンを押して話しかける！
    micBtn.addEventListener('click', () => {
      if (!recognition) {
        alert('このブラウザはマイクに対応していません。ChromeまたはSafariでお試しください！');
        return;
      }

      if (isRecording) {
        recognition.stop();
      } else {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        videoCard.classList.remove('speaking');
        if (avatarVideo) {
          avatarVideo.pause();
          avatarVideo.currentTime = 0;
        }

        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    });

    // ==========================================
    // 3. AIの頭脳（Google Gemini ＋ 内蔵スマート頭脳）
    // ==========================================
    async function handleUserQuery(query) {
      captionSpeaker.textContent = 'ai';
      captionText.textContent = 'aiが考え中…💭';

      const apiKey = getApiKey();
      const q = query.toUpperCase();
      let reply = '';

      // 内蔵知識（カギがなくても即座に声でおしゃべり！）
      if (q.includes('こんにちは') || q.includes('初めまして') || q.includes('ハロー')) {
        reply = 'こんにちは！Zoomにご参加いただきありがとうございます。今日はどんなお話をしましょうか？';
      } else if (q.includes('自己紹介') || q.includes('誰') || q.includes('名前')) {
        reply = '私はあなたの専属aiアシスタントです！Zoomでいつでもこうしてお話しできますよ。何でも聞いてくださいね！';
      } else if (q.includes('元気') || q.includes('調子')) {
        reply = '絶好調ですよ！Zoomでお会いできて嬉しいです。あなたは今日どんな一日でしたか？';
      } else if (q.includes('ミネストローネ') || q.includes('レシピ') || q.includes('料理')) {
        reply = 'ミネストローネですね！玉ねぎ、人参、ベーコンを炒めて、トマト缶とコンソメで煮込むだけで美味しく作れますよ！';
      } else if (q.includes('GDP') || q.includes('経済') || q.includes('成長率')) {
        reply = '世界のGDPトップはアメリカ、2位が中国、3位ドイツ、4位日本です！インドの急成長もすごい勢いですね。';
      } else if (q.includes('日本') && (q.includes('予測') || q.includes('今後') || q.includes('将来'))) {
        reply = '今後の日本は、賃上げとデフレ脱却、そしてAIへの投資が最大の鍵になると予測されています！';
      } else if (q.includes('天気')) {
        reply = '今日はお散歩日和だといいですね！お出かけのときは上着を一枚持っていくと安心ですよ。';
      } else if (q.includes('ありがとう')) {
        reply = 'どういたしまして！お役に立ててとっても嬉しいです！';
      }

      // カギがあればGoogle Gemini AIに口頭用ショート回答を作ってもらう
      if (!reply && apiKey) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `あなたはZoomでオンライン対話をしている親切で聡明な女性AIパートナー「ai」です。親しみやすく落ち着いた自然な日本語で、音声会話用として聞き取りやすいように、1〜2文（最大80文字程度）で簡潔にお返事してください。\n\n質問: ${query}`
                }]
              }]
            })
          });

          if (!response.ok) {
            throw new Error(`APIエラー: ${response.status}`);
          }

          const data = await response.json();
          reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        } catch (e) {
          console.error(e);
          reply = '電波の調子が乱れたようです。もう一度お話しいただけますか？';
        }
      }

      if (!reply) {
        reply = `「${query}」ですね！よく分かりました。あなたとZoomでお話しできてとても楽しいです！`;
      }

      speakText(reply);
    }
  </script>

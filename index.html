<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボイスAIアシスタント</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* アプリ枠（スマホサイズ対応） */
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
    }

    /* ヘッダー */
    .header {
      width: 100%;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .key-btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    /* アバター表示エリア（中央） */
    .avatar-area {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 20px;
    }

    /* アバターの丸い枠 */
    .avatar-frame {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
      position: relative;
      background-color: #ffffff;
      transition: box-shadow 0.3s, border-color 0.3s;
      cursor: pointer;
    }

    /* 声を出してお話し中の光る演出 */
    .avatar-frame.speaking {
      box-shadow: 0 0 45px rgba(56, 189, 248, 0.9), 0 0 15px rgba(255, 255, 255, 0.6);
      border-color: #7dd3fc;
    }

    /* アバター動画本体 */
    .avatar-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      display: block;
    }

    /* AIの状態バッジ */
    .status-badge {
      margin-top: 14px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
    }

    .status-badge.listening .status-dot {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .status-badge.speaking .status-dot {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* 動画スピード切り替えセレクター */
    .speed-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
    }

    .speed-label {
      font-weight: 500;
    }

    .speed-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .speed-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .speed-btn.active {
      background: #0ea5e9;
      color: #ffffff;
      border-color: #38bdf8;
      font-weight: bold;
    }

    /* 字幕表示エリア */
    .subtitles-area {
      width: 90%;
      min-height: 80px;
      max-height: 120px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.5;
      color: #e2e8f0;
      overflow-y: auto;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .subtitle-speaker {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .subtitle-text {
      font-size: 14px;
      word-break: break-word;
    }

    /* 操作フッター */
    .controls-footer {
      width: 100%;
      padding: 15px 20px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.8);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* 大きなマイクボタン */
    .mic-button {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      border: none;
      color: white;
      font-size: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
      outline: none;
    }

    .mic-button:active {
      transform: scale(0.92);
    }

    .mic-button.recording {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .mic-hint {
      font-size: 12px;
      color: #94a3b8;
    }

    /* カギ設定の小窓 */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-card {
      background: #1e293b;
      padding: 22px;
      border-radius: 14px;
      width: 100%;
      max-width: 360px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .modal-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .modal-input {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      border: none;
    }

    .modal-btn.cancel { background: #334155; color: white; }
    .modal-btn.save { background: #0ea5e9; color: white; font-weight: bold; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ヘッダー -->
    <div class="header">
      <div class="title">🎙️ AIアバターアシスタント</div>
      <button class="key-btn" id="keyBtn">🔑 カギ設定</button>
    </div>

    <!-- アバター表示エリア（中央） -->
    <div class="avatar-area">
      <!-- 丸い枠の中に動画アバター（過去の記憶を無視するおまじない付き） -->
      <div class="avatar-frame" id="avatarFrame" title="クリックでテスト動作できます">
        <video id="avatarVideo" class="avatar-video" src="avatar.mp4?v=20261109" poster="avatar.jpg?v=20261109" playsinline muted loop preload="auto"></video>
      </div>

      <!-- 状態バッジ -->
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">待機中（マイクを押してね）</span>
      </div>

      <!-- 動画スピード切り替えボタン（お好みの速さを選べます） -->
      <div class="speed-selector">
        <span class="speed-label">口の速度:</span>
        <button class="speed-btn" data-speed="0.7">ゆっくり (0.7x)</button>
        <button class="speed-btn active" data-speed="0.85">自然 (0.85x)</button>
        <button class="speed-btn" data-speed="1.0">標準 (1.0x)</button>
      </div>

      <!-- 字幕エリア -->
      <div class="subtitles-area" id="subtitlesArea">
        <div class="subtitle-speaker" id="subtitleSpeaker">AIアバター</div>
        <div class="subtitle-text" id="subtitleText">こんにちは！下のマイクボタンを押して、何でも声で話しかけてみてね。</div>
      </div>
    </div>

    <!-- 操作フッター -->
    <div class="controls-footer">
      <button class="mic-button" id="micBtn" title="押して話しかける">🎙️</button>
      <div class="mic-hint" id="micHint">マイクボタンを押して話しかけてね</div>
    </div>

    <!-- カギ設定の小窓 -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card">
        <div class="modal-title">🔑 Google AIのカギ（APIキー）</div>
        <div class="modal-desc">Google AI Studioのカギを貼り付けてください。あなたの端末だけに安全に保存されます。</div>
        <input type="password" id="apiKeyInput" class="modal-input" placeholder="AIzaSy...">
        <div class="modal-btns">
          <button class="modal-btn cancel" id="modalCancel">キャンセル</button>
          <button class="modal-btn save" id="modalSave">保存する</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ★ HTMLに直接カギを埋め込んでおきたい場合は、
    // 　下の「""」の中にカギを貼り付けてください！
    // ==========================================
    const EMBEDDED_API_KEY = ""; 

    const avatarFrame = document.getElementById('avatarFrame');
    const avatarVideo = document.getElementById('avatarVideo');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const subtitleSpeaker = document.getElementById('subtitleSpeaker');
    const subtitleText = document.getElementById('subtitleText');
    const micBtn = document.getElementById('micBtn');
    const micHint = document.getElementById('micHint');

    let currentSpeed = 0.85; // 自然で落ち着いた速度
    const speedBtns = document.querySelectorAll('.speed-btn');
    speedBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        speedBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSpeed = parseFloat(btn.dataset.speed);
        if (avatarVideo) {
          avatarVideo.playbackRate = currentSpeed;
        }
        speakText(`速度を${btn.dataset.speed}倍に切り替えました。動きはどうですか？`);
      });
    });

    const keyBtn = document.getElementById('keyBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modalCancel = document.getElementById('modalCancel');
    const modalSave = document.getElementById('modalSave');

    const API_KEY_STORAGE = 'voice_ai_gemini_key';

    // カギを取得
    function getApiKey() {
      if (EMBEDDED_API_KEY && EMBEDDED_API_KEY.trim() !== "") {
        return EMBEDDED_API_KEY.trim();
      }
      return localStorage.getItem(API_KEY_STORAGE) || "";
    }

    // カギ設定モーダル
    keyBtn.addEventListener('click', () => {
      apiKeyInput.value = getApiKey();
      modalOverlay.style.display = 'flex';
    });

    modalCancel.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
    });

    modalSave.addEventListener('click', () => {
      const val = apiKeyInput.value.trim();
      if (val) {
        localStorage.setItem(API_KEY_STORAGE, val);
        modalOverlay.style.display = 'none';
        speakText('新しいカギをセットしました！何でも声で話しかけてみてくださいね。');
      } else {
        localStorage.removeItem(API_KEY_STORAGE);
        modalOverlay.style.display = 'none';
      }
    });

    // ==========================================
    // 1. AIが声でお返事する機能（位置固定＆口パク連動！）
    // ==========================================
    function speakText(text) {
      if (!window.speechSynthesis) {
        subtitleText.textContent = text;
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 1.05;
      utterance.pitch = 1.15; // 明るく自然な女性の声のトーン

      const voices = window.speechSynthesis.getVoices();
      const jaVoice = voices.find(v => v.lang.includes('ja') && (v.name.includes('Google') || v.name.includes('Kyoko') || v.name.includes('Ayumi') || v.name.includes('Natural') || v.name.includes('Haruka')));
      if (jaVoice) {
        utterance.voice = jaVoice;
      }

      // 音声開始：動画を指定スピードで再生！
      utterance.onstart = () => {
        avatarFrame.classList.add('speaking');
        statusBadge.className = 'status-badge speaking';
        statusText.textContent = 'お話し中…🗣️';
        subtitleSpeaker.textContent = 'AIアバター';
        subtitleText.textContent = text;
        if (avatarVideo) {
          avatarVideo.playbackRate = currentSpeed;
          avatarVideo.play().catch(e => console.log('Video play error:', e));
        }
      };

      // 音声終了：動画を一時停止して最初の笑顔に戻る！
      utterance.onend = () => {
        avatarFrame.classList.remove('speaking');
        statusBadge.className = 'status-badge';
        statusText.textContent = '待機中（マイクを押してね）';
        if (avatarVideo) {
          avatarVideo.pause();
          avatarVideo.currentTime = 0;
        }
      };

      utterance.onerror = () => {
        avatarFrame.classList.remove('speaking');
        statusBadge.className = 'status-badge';
        statusText.textContent = '待機中（マイクを押してね）';
        if (avatarVideo) {
          avatarVideo.pause();
          avatarVideo.currentTime = 0;
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    // アバターの顔をクリックすると、テストでおしゃべりする機能！
    avatarFrame.addEventListener('click', () => {
      speakText('こんにちは！お声を聞かせてくださいね。マイクを押してお話しできますよ！');
    });

    // ==========================================
    // 2. 音声認識（あなたの声を聴き取る耳！）
    // ==========================================
    let recognition = null;
    let isRecording = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        statusBadge.className = 'status-badge listening';
        statusText.textContent = '聞いています…🎙️';
        micHint.textContent = 'お話し終わると自動でお返事します';
        subtitleSpeaker.textContent = 'あなた';
        subtitleText.textContent = 'お話し中…';
      };

      recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript;
        subtitleSpeaker.textContent = 'あなた';
        subtitleText.textContent = spokenText;
        handleUserQuery(spokenText);
      };

      recognition.onerror = (event) => {
        console.error(event);
        resetMic();
        if (event.error === 'not-allowed') {
          alert('マイクの利用が許可されていません。ブラウザのアドレスバーのマイクマークから許可してくださいね！');
        }
      };

      recognition.onend = () => {
        resetMic();
      };
    } else {
      micHint.textContent = 'このブラウザは音声認識に対応していません（ChromeやEdge推奨）';
    }

    function resetMic() {
      isRecording = false;
      micBtn.classList.remove('recording');
      micHint.textContent = 'マイクボタンを押して話しかけてね';
    }

    // マイクボタンクリック
    micBtn.addEventListener('click', () => {
      if (!recognition) {
        alert('このブラウザはマイクに対応していません。Google ChromeまたはEdgeでお試しください！');
        return;
      }

      if (isRecording) {
        recognition.stop();
      } else {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        avatarFrame.classList.remove('speaking');
        if (avatarVideo) {
          avatarVideo.pause();
          avatarVideo.currentTime = 0;
        }

        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    });

    // ==========================================
    // 3. AIの頭脳（Google Gemini ＋ 内蔵スマート頭脳）
    // ==========================================
    async function handleUserQuery(query) {
      statusBadge.className = 'status-badge';
      statusText.textContent = 'AIが考え中…💭';

      const apiKey = getApiKey();
      const q = query.toUpperCase();
      let reply = '';

      // 内蔵知識（カギがなくても即座に声でおしゃべり！）
      if (q.includes('こんにちは') || q.includes('初めまして') || q.includes('ハロー')) {
        reply = 'こんにちは！お声を聞かせてくれてありがとうございます。今日はどんなお話をしましょうか？';
      } else if (q.includes('自己紹介') || q.includes('誰') || q.includes('名前')) {
        reply = '私はあなたの専属AIアバターアシスタントです！口頭でお話しできるのがとっても嬉しいです。何でも聞いてくださいね！';
      } else if (q.includes('元気') || q.includes('調子')) {
        reply = '絶好調ですよ！あなたとお話しできて元気いっぱいです。あなたは今日どんな一日でしたか？';
      } else if (q.includes('ミネストローネ') || q.includes('レシピ') || q.includes('料理')) {
        reply = 'ミネストローネですね！玉ねぎ、人参、ベーコンを炒めて、トマト缶とコンソメで煮込むだけでとっても美味しく作れますよ！';
      } else if (q.includes('GDP') || q.includes('経済') || q.includes('成長率')) {
        reply = '世界のGDPトップはアメリカ、2位が中国、3位ドイツ、4位日本です！インドの急成長もすごい勢いですね。';
      } else if (q.includes('日本') && (q.includes('予測') || q.includes('今後') || q.includes('将来'))) {
        reply = '今後の日本は、賃上げとデフレ脱却、そしてAIや自動化技術への投資が最大の鍵になると予測されています！';
      } else if (q.includes('天気')) {
        reply = '今日はお散歩日和だといいですね！お出かけのときは上着を一枚持っていくと安心ですよ。';
      } else if (q.includes('ありがとう')) {
        reply = 'どういたしまして！お役に立ててとっても嬉しいです！';
      }

      // カギがあればGoogle Gemini AIに口頭用ショート回答を作ってもらう
      if (!reply && apiKey) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: 'あなたは音声で会話しているAIアバターです。親しみやすく明るいトーンで、長文にならず「2〜3文」で簡潔に口頭でお返事してください：\n\n' + query }]
              }]
            })
          });

          const data = await response.json();
          if (data && data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
            const parts = data.candidates[0].content.parts;
            const answerParts = parts.filter(p => !p.thought && p.text);
            reply = (answerParts.length > 0 ? answerParts : parts).map(p => p.text).join(' ').trim();
          }
        } catch (e) {
          console.error(e);
        }
      }

      if (!reply) {
        reply = `「${query}」ですね！しっかり声が届きましたよ。もっといろんなお話を聞かせてくださいね！`;
      }

      // 声でお返事し、お口をパクパク動かす！
      speakText(reply);
    }
  </script>

</body>
</html>

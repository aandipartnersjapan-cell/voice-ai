<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zoom - ai</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 携帯（スマホ）画面にぴったり固定！スクロールさせない！ */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* スマホのアドレスバー考慮の最新規格 */
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      position: fixed;
    }

    /* Zoom スマホ専用コンテナ（全画面ピッタリ） */
    .zoom-phone-app {
      width: 100%;
      max-width: 440px;
      height: 100%;
      height: 100dvh;
      margin: 0 auto;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* ==========================================
       1. Zoom 上部ヘッダー（RECなし・シンプル）
       ========================================== */
    .zoom-top-bar {
      width: 100%;
      height: 44px;
      flex-shrink: 0;
      background: #1a1a1a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      z-index: 30;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #22c55e;
    }

    .meeting-name {
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
    }

    .meeting-timer {
      font-size: 12px;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
    }

    .leave-btn {
      background: #e11d48;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ==========================================
       2. メインエリア（携帯画面に美しく収まるサイズ）
       ========================================== */
    .zoom-main-body {
      flex: 1;
      width: 100%;
      min-height: 0; /* 縮小を許可して下部が押し出されないようにする */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 8px 12px;
      position: relative;
    }

    /* 相手（ai）のZoomビデオ枠（携帯に合わせた美しい比率！） */
    .video-card {
      width: 100%;
      max-width: 380px;
      height: 44vh; /* 画面の44%以内に抑え、マイクが絶対に見えるようにする！ */
      background: #1c1c1e;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      border: 3px solid transparent;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      transition: border-color 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }

    /* 発言中：Zoomグリーンの枠で光る！ */
    .video-card.speaking {
      border-color: #00da5a;
      box-shadow: 0 0 20px rgba(0, 218, 90, 0.5);
    }

    /* アバター動画 */
    .remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%; /* 女性の顔が綺麗に収まる位置 */
      display: block;
    }

    /* Zoom 左下ネームタグ（ai） */
    .name-tag {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #ffffff;
      z-index: 10;
    }

    .mic-dot {
      color: #22c55e;
      font-size: 10px;
    }

    /* Zoom 右上セルフビュー小窓（あなた） */
    .self-view {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 75px;
      height: 95px;
      background: #27272a;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: #94a3b8;
      font-size: 9px;
    }

    .self-icon {
      font-size: 22px;
      margin-bottom: 2px;
    }

    /* リアルタイム字幕（Live Captions） */
    .zoom-captions {
      width: 100%;
      max-width: 380px;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      line-height: 1.4;
      color: #f8fafc;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin: 4px 0;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .caption-speaker {
      font-size: 10px;
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 2px;
    }

    /* ==========================================
       3. 画面中央の大きなマイクボタン（最重要！絶対に常時見える！）
       ========================================== */
    .main-mic-action {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: center;
      padding: 4px 0;
    }

    .mic-big-button {
      width: 100%;
      height: 52px;
      border-radius: 26px;
      background: linear-gradient(135deg, #0e71eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(14, 113, 235, 0.5);
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .mic-big-button:active {
      transform: scale(0.96);
    }

    /* 録音中（話しかけている時）：赤く光る！ */
    .mic-big-button.recording {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
      animation: micPulse 1.2s infinite;
    }

    @keyframes micPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    /* ==========================================
       4. Zoom 下部コントロールバー（画面最下部に固定）
       ========================================== */
    .zoom-bottom-bar {
      width: 100%;
      height: 64px;
      flex-shrink: 0;
      background: #18181b;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 4px 10px 10px; /* スマホ下部セーフエリア */
      z-index: 30;
    }

    .zoom-tool-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none;
      border: none;
      color: #a1a1aa;
      font-size: 10px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .zoom-tool-item:hover {
      color: #ffffff;
    }

    .tool-icon {
      font-size: 20px;
      height: 22px;
      display: flex;
      align-items: center;
    }

    /* カギ設定モーダル */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-card {
      background: #27272a;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 320px;
      border: 1px solid #3f3f46;
    }

    .modal-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #f8fafc;
    }

    .modal-desc {
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .modal-input {
      width: 100%;
      padding: 10px;
      background: #18181b;
      border: 1px solid #3f3f46;
      color: white;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      border: none;
    }

    .modal-btn.cancel { background: #3f3f46; color: white; }
    .modal-btn.save { background: #0e71eb; color: white; font-weight: bold; }
  </style>
</head>
<body>

  <div class="zoom-phone-app">
    <!-- 1. Zoom 上部ヘッダー（RECなし・シンプル） -->
    <div class="zoom-top-bar">
      <div class="top-left">
        <span>🛡️</span>
        <span class="meeting-name">Zoom Meeting</span>
      </div>
      <div class="meeting-timer" id="meetingTimer">00:00</div>
      <button class="leave-btn" id="leaveBtn">終了</button>
    </div>

    <!-- 2. メインエリア（携帯画面にぴったり収まる！） -->
    <div class="zoom-main-body">
      <!-- 相手（ai）のカメラ映像枠（縦長すぎず綺麗なサイズ） -->
      <div class="video-card" id="videoCard" title="タップでテスト発言します">
        <video id="avatarVideo" class="remote-video" src="avatar.mp4?v=20261109" poster="avatar.jpg?v=20261109" playsinline muted loop preload="auto"></video>
        
        <!-- 左下のネームタグ（ai） -->
        <div class="name-tag">
          <span class="mic-dot">🎙️</span>
          <span>ai</span>
        </div>

        <!-- 右上のセルフビュー（あなた） -->
        <div class="self-view">
          <div class="self-icon">👤</div>
          <div>あなた</div>
        </div>
      </div>

      <!-- リアルタイム字幕（Live Captions） -->
      <div class="zoom-captions" id="zoomCaptions">
        <div class="caption-speaker" id="captionSpeaker">ai</div>
        <div id="captionText">こんにちは！下のマイクボタンを押してお話ししてね。</div>
      </div>

      <!-- 3. 中央の大きなマイクボタン（絶対に一目でわかる！） -->
      <div class="main-mic-action">
        <button class="mic-big-button" id="micBtn" title="押して話しかける">
          <span id="micIcon" style="font-size: 22px;">🎙️</span>
          <span id="micLabel">マイクを押して話す</span>
        </button>
      </div>
    </div>

    <!-- 4. Zoom 下部コントロールバー（画面最下部に固定） -->
    <div class="zoom-bottom-bar">
      <!-- 口の速度変更 -->
      <button class="zoom-tool-item" id="speedBtn" title="口の速度を変更">
        <div class="tool-icon">⚡</div>
        <span id="speedLabel">速度 0.85x</span>
      </button>

      <!-- 字幕の表示切替 -->
      <button class="zoom-tool-item" id="captionToggleBtn" title="字幕の表示/非表示">
        <div class="tool-icon">💬</div>
        <span>字幕</span>
      </button>

      <!-- カギ設定 -->
      <button class="zoom-tool-item" id="keyBtn" title="AIのカギ設定">
        <div class="tool-icon">⚙️</div>
        <span>設定</span>
      </button>
    </div>

    <!-- カギ設定モーダル -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card">
        <div class="modal-title">⚙️ Google AIカギ設定</div>
        <div class="modal-desc">Google AI Studioのカギを貼り付けると、aiが何でも声で考えてお返事します。</div>
        <input type="password" id="apiKeyInput" class="modal-input" placeholder="AIzaSy...">
        <div class="modal-btns">
          <button class="modal-btn cancel" id="modalCancel">キャンセル</button>
          <button class="modal-btn save" id="modalSave">保存する</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const EMBEDDED_API_KEY = ""; 

    const videoCard = document.getElementById('videoCard');
    const avatarVideo = document.getElementById('avatarVideo');
    const zoomCaptions = document.getElementById('zoomCaptions');
    const captionSpeaker = document.getElementById('captionSpeaker');
    const captionText = document.getElementById('captionText');
    const micBtn = document.getElementById('micBtn');
    const micIcon = document.getElementById('micIcon');
    const micLabel = document.getElementById('micLabel');
    const speedBtn = document.getElementById('speedBtn');
    const speedLabel = document.getElementById('speedLabel');
    const captionToggleBtn = document.getElementById('captionToggleBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const meetingTimer = document.getElementById('meetingTimer');

    const keyBtn = document.getElementById('keyBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modalCancel = document.getElementById('modalCancel');
    const modalSave = document.getElementById('modalSave');

    const API_KEY_STORAGE = 'voice_ai_gemini_key';

    // ミーティング経過時間タイマー
    let secondsElapsed = 0;
    setInterval(() => {
      secondsElapsed++;
      const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const s = String(secondsElapsed % 60).padStart(2, '0');
      meetingTimer.textContent = `${m}:${s}`;
    }, 1000);

    // 口の速度切り替え（0.85x → 1.0x → 0.7x）
    const speeds = [0.85, 1.0, 0.7];
    let speedIndex = 0;
    let currentSpeed = speeds[speedIndex];

    speedBtn.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % speeds.length;
      currentSpeed = speeds[speedIndex];
      speedLabel.textContent = `速度 ${currentSpeed}x`;
      if (avatarVideo) {
        avatarVideo.playbackRate = currentSpeed;
      }
      speakText(`速度を${currentSpeed}倍に変更しました。`);
    });

    // 字幕の表示/非表示
    captionToggleBtn.addEventListener('click', () => {
      zoomCaptions.style.display = (zoomCaptions.style.display === 'none') ? 'flex' : 'none';
    });

    // 終了ボタン
    leaveBtn.addEventListener('click', () => {
      if (confirm('Zoomミーティングを退出しますか？')) {
        speakText('ミーティングを終了します。お疲れ様でした！');
      }
    });

    // カギ取得
    function getApiKey() {
      if (EMBEDDED_API_KEY && EMBEDDED_API_KEY.trim() !== "") {
        return EMBEDDED_API_KEY.trim();
      }
      return localStorage.getItem(API_KEY_STORAGE) || "";
    }

    // カギ設定モーダル
    keyBtn.addEventListener('click', () => {
      apiKeyInput.value = getApiKey();
      modalOverlay.style.display = 'flex';
    });

    modalCancel.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
    });

    modalSave.addEventListener('click', () => {
      const val = apiKeyInput.value.trim();
      if (val) {
        localStorage.setItem(API_KEY_STORAGE, val);
        modalOverlay.style.display = 'none';
        speakText('新しいカギを保存しました！何でも声でお話ししてくださいね。');
      } else {
        localStorage.removeItem(API_KEY_STORAGE);
        modalOverlay.style.display = 'none';
      }
    });

    // ==========================================
    // 1. AIが声でお返事する機能（Zoom緑枠連動！）
    // ==========================================
    function speakText(text) {
      if (!window.speechSynthesis) {
        captionText.textContent = text;
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 1.0;
      utterance.pitch = 1.1;

      const voices = window.speechSynthesis.getVoices();
      const jaVoice = voices.find(v => v.lang.includes('ja') && (v.name.includes('Google') || v.name.includes('Kyoko') || v.name.includes('Ayumi') || v.name.includes('Natural') || v.name.includes('Haruka')));
      if (jaVoice) {
        utterance.voice = jaVoice;
      }

      // 音声開始：Zoom本物と同じ緑の発言枠が光る！
      utterance.onstart = () => {
        videoCard.classList.add('speaking');
        captionSpeaker.textContent = 'ai (発言中)';
        captionText.textContent = text;
        if (avatarVideo) {
          avatarVideo.playbackRate = currentSpeed;
          avatarVideo.play().catch(e => console.log('Video play error:', e));
        }
      };

      // 音声終了：枠の光を消して動画を停止！
      utterance.onend = () => {
        videoCard.classList.remove('speaking');
        captionSpeaker.textContent = 'ai';
        if (avatarVideo) {
          avatarVideo.pause();
          avatarVideo.currentTime = 0;
        }
      };

      utterance.onerror = () => {
        videoCard.classList.remove('speaking');
        captionSpeaker.textContent = 'ai';
        if (avatarVideo) {
          avatarVideo.pause();
          avatarVideo.currentTime = 0;
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    // 画面タップでテスト発言！
    videoCard.addEventListener('click', () => {
      speakText('こんにちは！Zoomミーティングへようこそ。下のマイクを押してお話ししてね！');
    });

    // ==========================================
    // 2. 音声認識（あなたの声を聴き取る耳！）
    // ==========================================
    let recognition = null;
    let isRecording = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        micIcon.textContent = '🔴';
        micLabel.textContent = '聴き取り中…（お話ししてね）';
        captionSpeaker.textContent = 'あなた';
        captionText.textContent = 'お話し中…（話し終わると自動でお返事します）';
      };

      recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript;
        captionSpeaker.textContent = 'あなた';
        captionText.textContent = spokenText;
        handleUserQuery(spokenText);
      };

      recognition.onerror = (event) => {
        console.error(event);
        resetMic();
        if (event.error === 'not-allowed') {
          alert('マイクの利用が許可されていません。ブラウザのアドレスバーからマイクを許可してください！');
        }
      };

      recognition.onend = () => {
        resetMic();
      };
    } else {
      micLabel.textContent = 'マイク非対応ブラウザ';
    }

    function resetMic() {
      isRecording = false;
      micBtn.classList.remove('recording');
      micIcon.textContent = '🎙️';
      micLabel.textContent = 'マイクを押して話す';
    }

    // マイクボタンクリック
    micBtn.addEventListener('click', () => {
      if (!recognition) {
        alert('このブラウザはマイクに対応していません。ChromeまたはSafariでお試しください！');
        return;
      }

      if (isRecording) {
        recognition.stop();
      } else {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        videoCard.classList.remove('speaking');
        if (avatarVideo) {
          avatarVideo.pause();
          avatarVideo.currentTime = 0;
        }

        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    });

    // ==========================================
    // 3. AIの頭脳（Google Gemini ＋ 内蔵スマート頭脳）
    // ==========================================
    async function handleUserQuery(query) {
      captionSpeaker.textContent = 'ai';
      captionText.textContent = 'aiが考え中…💭';

      const apiKey = getApiKey();
      const q = query.toUpperCase();
      let reply = '';

      // 内蔵知識（カギがなくても即座に声でおしゃべり！）
      if (q.includes('こんにちは') || q.includes('初めまして') || q.includes('ハロー')) {
        reply = 'こんにちは！Zoomミーティングにご参加いただきありがとうございます。今日はどんなお話をしましょうか？';
      } else if (q.includes('自己紹介') || q.includes('誰') || q.includes('名前')) {
        reply = '私はあなたの専属aiアシスタントです！Zoomでいつでもこうしてお話しできますよ。何でも聞いてくださいね！';
      } else if (q.includes('元気') || q.includes('調子')) {
        reply = '絶好調ですよ！Zoomでお会いできて嬉しいです。あなたは今日どんな一日でしたか？';
      } else if (q.includes('ミネストローネ') || q.includes('レシピ') || q.includes('料理')) {
        reply = 'ミネストローネですね！玉ねぎ、人参、ベーコンを炒めて、トマト缶とコンソメで煮込むだけで美味しく作れますよ！';
      } else if (q.includes('GDP') || q.includes('経済') || q.includes('成長率')) {
        reply = '世界のGDPトップはアメリカ、2位が中国、3位ドイツ、4位日本です！インドの急成長もすごい勢いですね。';
      } else if (q.includes('日本') && (q.includes('予測') || q.includes('今後') || q.includes('将来'))) {
        reply = '今後の日本は、賃上げとデフレ脱却、そしてAIへの投資が最大の鍵になると予測されています！';
      } else if (q.includes('天気')) {
        reply = '今日はお散歩日和だといいですね！お出かけのときは上着を一枚持っていくと安心ですよ。';
      } else if (q.includes('ありがとう')) {
        reply = 'どういたしまして！お役に立ててとっても嬉しいです！';
      }

      // カギがあればGoogle Gemini AIに口頭用ショート回答を作ってもらう
      if (!reply && apiKey) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `あなたはZoomでオンライン対話をしている親切で聡明な女性AIパートナー「ai」です。親しみやすく落ち着いた自然な日本語で、音声会話用として聞き取りやすいように、1〜2文（最大80文字程度）で簡潔にお返事してください。\n\n質問: ${query}`
                }]
              }]
            })
          });

          if (!response.ok) {
            throw new Error(`APIエラー: ${response.status}`);
          }

          const data = await response.json();
          reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        } catch (e) {
          console.error(e);
          reply = '電波の調子が乱れたようです。もう一度お話しいただけますか？';
        }
      }

      if (!reply) {
        reply = `「${query}」ですね！よく分かりました。あなたとZoomでお話しできてとても楽しいです！`;
      }

      speakText(reply);
    }
  </script>
</body>
</html>
